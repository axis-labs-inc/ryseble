[project]
name = "ryseble"
version = "2.0.0"
description = "Async Python library for RYSE BLE Smart Shade devices (used by the Home Assistant integration)."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [ { name = "MOHAMED Kallel", email = "mohamed.kallel@yahoo.fr" } ]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

dependencies = [
  "bleak>=3.0.2",
  "bleak-retry-connector>=4.6.3",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "dbus-fast>=2.21",
]

[project.urls]
Homepage = "https://github.com/mohamedkallel82/ryseble"
"Bug Tracker" = "https://github.com/mohamedkallel82/ryseble/issues"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ryseble*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
